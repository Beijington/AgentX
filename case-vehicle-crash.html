    <h1>整车碰撞分析</h1>
    <p>使用 LS-DYNA 进行整车显式动力学碰撞分析。下图展示碰撞过程中的等效塑性应变分布。</p>
    <img src="assets/images/vehicle-crash.png" alt="AgentX 中的整车碰撞等效塑性应变云图">
    <h2>标准化交付流程</h2>
    <p>将碰撞分析的执行步骤、异常诊断和报告生成纳入统一流程，减少重复调试与人工整理，降低交付结果因操作差异而波动的风险。</p>
    <h2>验证目标</h2>
    <ul>
      <li>分析交付周期从 3–5 天缩短至 24 小时以内。</li>
      <li>新人熟练周期从 12–18 个月缩短至 1–3 个月。</li>
      <li>将结果离散度从约 ±15%–20% 控制在 ±5% 以内。</li>
    </ul>
