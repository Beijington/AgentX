    <h1>4680 电池包强制对流冷却仿真</h1>
    <p>本教学算例以采用特斯拉 4680 电芯的简化空气换热模型为对象，使用 OpenFOAM 分析强制空气冷却时电芯周围的流动与传热。</p>
    <img src="assets/images/battery-cooling.png" alt="AgentX 中的电池阵列截面温度云图与流向箭头">
    <h2>模型与工况</h2>
    <p>几何由 Aleksander Sodawski 使用 FreeCAD 建立。算例设定每个电芯发热 100 W，总发热 2000 W。参数为教学演示设定。</p>
    <h2>结果查看</h2>
    <p>在 AgentX 中查看截面温度云图，并叠加速度方向箭头，便于对照电芯间的气流路径与温度分布。</p>
    <p><a href="https://holzmann-cfd.de/community/training-cases/battery-cooling">原始教学算例</a></p>
